name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Java modules
        run: mvn --batch-mode verify
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Angular components
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test -- --watch=false
      - name: Build the application and start dependencies
        run: docker compose up --build -d
      - name: Verify the workflow through HTTP
        run: python3 scripts/smoke.py
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the test environment
        if: always()
        run: docker compose down --volumes
