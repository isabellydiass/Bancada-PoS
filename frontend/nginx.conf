limit_req_zone $binary_remote_addr zone=comparison_start:1m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 16k;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    proxy_http_version 1.1;

    location = /api/readiness {
        add_header Cache-Control "no-store";
        return 204;
    }

    location = /api/comparisons {
        limit_req zone=comparison_start burst=10 nodelay;
        limit_req_status 429;
        set $recorder recorder:8080;
        proxy_pass http://$recorder;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/comparisons/ {
        set $evidence evidence:8080;
        proxy_pass http://$evidence;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
